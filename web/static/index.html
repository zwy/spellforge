<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咒语工坊 · SpellForge</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa3b2; --accent: #6c8cff; --accent2: #4ade80;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif; display: flex; min-height: 100vh; }
  aside { width: 260px; background: var(--panel); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; height: 100vh; position: sticky; top: 0; flex-shrink: 0; }
  aside h1 { font-size: 16px; margin-bottom: 4px; }
  aside .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .brand-row h1 { margin-bottom: 0; }
  .mode-switch { display: flex; gap: 6px; margin: 10px 0 8px; }
  .mode-switch button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .mode-switch button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .group-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
  .nav-item { display: block; width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px; color: var(--text); background: none; border: none; cursor: pointer; font-size: 13px; }
  .nav-item:hover { background: var(--panel2); }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item .count { float: right; color: var(--muted); font-size: 11px; }
  .nav-item.active .count { color: #cdd6ff; }
  main { flex: 1; padding: 24px 28px; max-width: 1080px; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .topbar h2 { font-size: 20px; }
  .topbar h3 { font-size: 15px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
  .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .spacer { flex: 1; }
  input[type=search] { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); width: 240px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .why { color: var(--muted); margin-bottom: 20px; max-width: 78ch; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .card-head h3 { font-size: 15px; }
  .ar-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(74,222,128,.12); color: var(--accent2); }
  .prompt { color: var(--muted); white-space: pre-wrap; font-size: 13px; background: var(--panel2); padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
  .meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta-row input { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 90px; font-size: 12px; }
  .meta-row a { color: var(--accent); text-decoration: none; font-size: 12px; }
  details.cc { margin-top: 8px; }
  details.cc summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  .cc-item { margin-top: 8px; display: flex; gap: 6px; align-items: flex-start; }
  .cc-item input.cc-label { width: 120px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; flex-shrink: 0; }
  .cc-item textarea { width: 100%; min-height: 56px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; resize: vertical; }
  .cc-actions { margin-top: 10px; display: flex; gap: 8px; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .cc-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(108,140,255,.15); color: var(--accent); }
  #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); font-size: 13px; display: none; z-index: 99; max-width: 420px; }
  .toast.ok { border-color: var(--accent2); }
  .toast.err { border-color: var(--err); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .type-person { background: rgba(108,140,255,.15); color: var(--accent); }
  .type-product { background: rgba(74,222,128,.12); color: var(--accent2); }
  .type-scene { background: rgba(251,191,36,.12); color: #fbbf24; }
  .type-brand { background: rgba(217,140,255,.15); color: #d98cff; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
  .field select, .field textarea { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 13px; }
  .field textarea { min-height: 72px; resize: vertical; }
  .field input[type=text], .field input[type=password], .field input:not([type]) { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 13px; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .tpl-preview { color: var(--muted); font-size: 12px; background: var(--panel2); padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
  .gen-result .prompt { color: var(--text); }
  .gen-result .prompt.en { color: var(--muted); font-size: 12.5px; }
  .hist-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .hist-item:hover { border-color: var(--accent); }
  .hist-item .t { color: var(--muted); font-size: 11px; }
  .hist-item .s { font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-person { background: rgba(108,140,255,.15); color: var(--accent); }
  .type-product { background: rgba(74,222,128,.12); color: var(--accent2); }
  .type-scene { background: rgba(251,191,36,.12); color: #fbbf24; }
  .type-brand { background: rgba(217,140,255,.15); color: #d98cff; }
  .subj-meta { color: var(--muted); font-size: 11px; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .brand-row h1 { margin-bottom: 0; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; z-index: 300; padding-top: 8vh; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 620px; max-width: 94vw; max-height: 84vh; overflow-y: auto; padding: 18px; }
  .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .modal-head h2 { font-size: 17px; }
  .llm-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .llm-item.active { border-color: var(--accent2); }
  .llm-meta { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h4.section { margin: 16px 0 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<aside>
  <div class="brand-row">
    <h1>咒语工坊</h1>
    <button class="btn small" id="btn-settings" title="LLM 设置">⚙ 设置</button>
  </div>
  <div class="sub">openrouter.ai / benchmarks / styles</div>
  <div class="sub"><a href="/spec.md" target="_blank" style="color:var(--accent)">《通用自然语言提示词规范》 ↗</a></div>
  <div class="mode-switch">
    <button id="mode-browse" class="active">场景库</button>
    <button id="mode-subj">主体库</button>
    <button id="mode-gen">生成器</button>
  </div>
  <div id="nav"></div>
</aside>
<main>
  <div id="browse-view">
    <div class="topbar">
      <h2 id="style-title">加载中…</h2>
      <span class="badge" id="style-count"></span>
      <span class="spacer"></span>
      <input id="search" type="search" placeholder="搜索 prompt / 场景…">
      <button class="btn" id="btn-scrape">更新数据</button>
      <button class="btn primary" id="btn-enrich">LLM 补全</button>
    </div>
    <p class="why" id="style-why"></p>
    <div id="cards"></div>
  </div>

  <div id="subj-view" style="display:none">
    <div class="topbar">
      <h2>主体库</h2>
      <span class="badge" id="subj-count"></span>
    </div>
    <div class="card">
      <div class="field-row">
        <div class="field" style="max-width:180px">
          <label>类型</label>
          <select id="subj-type">
            <option>人物</option><option>产品</option><option>景物</option><option>品牌</option>
          </select>
        </div>
        <div class="field">
          <label>名称</label>
          <input id="subj-name" type="text" placeholder="例：街拍青年、枫叶咖啡壶">
        </div>
      </div>
      <div class="field">
        <label>描述（生成提示词时使用的完整主体描述）</label>
        <textarea id="subj-desc" placeholder="详细描述主体的外貌、特征与风格。生成提示词时会把这些特征直接写入提示词。"></textarea>
      </div>
      <button class="btn primary" id="subj-save">添加主体</button>
      <button class="btn" id="subj-cancel" style="display:none">取消编辑</button>
    </div>
    <div id="subj-list"></div>
  </div>

  <div id="gen-view" style="display:none">
    <div class="topbar">
      <h2>Prompt 生成器</h2>
      <span class="badge" id="gen-current-model">模型加载中…</span>
      <span class="spacer"></span>
    </div>
    <div class="card">
      <div class="field-row">
        <div class="field">
          <label>风格</label>
          <select id="gen-style"></select>
        </div>
        <div class="field">
          <label>场景</label>
          <select id="gen-scenario"></select>
        </div>
      </div>
      <div class="field">
        <label>创意模板</label>
        <select id="gen-template"></select>
      </div>
      <div class="field">
        <label>模板内容</label>
        <div class="tpl-preview" id="gen-tpl-preview">选择模板后显示</div>
      </div>
      <div class="field">
        <label>画幅比例（留空由 LLM 按规范决定）</label>
        <select id="gen-ratio">
          <option value="">自动</option>
        </select>
      </div>
      <div class="field">
        <label>主体（从主体库选择；选「自定义」则手动输入）</label>
        <select id="gen-subject-sel">
          <option value="">自定义（手动输入）</option>
        </select>
      </div>
      <div class="field">
        <label>主体描述</label>
        <textarea id="gen-subject" placeholder="例：一只戴红色围巾的柯基犬；或从上方选择主体后自动填入，可再修改"></textarea>
      </div>
      <button class="btn primary" id="gen-go">生成提示词</button>
      <span class="badge" id="gen-status" style="display:none"></span>
    </div>
    <div id="gen-result"></div>
    <div class="topbar" style="margin-top:24px">
      <h3>生成历史</h3>
      <span class="spacer"></span>
      <button class="btn small" id="btn-refresh-hist">刷新</button>
    </div>
    <div id="gen-history"></div>
  </div>

</main>

<div id="settings-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>⚙ LLM 设置</h2>
      <span class="spacer"></span>
      <button class="btn small" data-close>关闭</button>
    </div>
    <p class="why" style="margin-bottom:12px">可保存多个 OpenAI 规范（chat）配置，点「设为使用」切换当前生效配置；未启用任何配置时使用 .env / 环境变量。配置保存在本地 data/personal.db，不会随项目公开。</p>
    <div class="badge" id="llm-current" style="margin-bottom:12px; display:inline-block"></div>
    <h4 class="section">我的配置</h4>
    <div id="llm-profile-list"></div>
    <h4 class="section" id="llm-form-title">添加配置</h4>
    <div class="field-row">
      <div class="field"><label>名称</label>
        <input id="llm-name" type="text" placeholder="例：OpenRouter 主力"></div>
      <div class="field"><label>模型</label>
        <input id="llm-model" type="text" placeholder="deepseek/deepseek-v4.1-flash"></div>
    </div>
    <div class="field"><label>BASE_URL（OpenAI 规范，不含 /chat/completions）</label>
      <input id="llm-base-url" type="text" placeholder="https://openrouter.ai/api/v1"></div>
    <div class="field"><label>API_KEY（编辑时留空 = 不修改）</label>
      <input id="llm-api-key" type="password" placeholder="sk-..."></div>
    <button class="btn primary" id="llm-save">保存配置</button>
    <button class="btn" id="llm-cancel-edit" style="display:none">取消编辑</button>
  </div>
</div>
<div id="toast" class="toast" style="display:none"></div>

<script>
const RATIOS = ["1:1","2:3","3:2","4:5","5:4","3:4","4:3","9:16","16:9"];
const SUBJ_TYPES = ["人物", "产品", "景物", "品牌"];
const TYPE_KEYS = { "人物": "person", "产品": "product", "景物": "scene", "品牌": "brand" };
const state = {
  data: null, activeId: null, q: "", view: "browse",
  genHistory: [], genData: null, subjects: [],
  editingSubjectId: null, genSubjectId: null,
  llm: { profiles: [], editingId: null, current: null },
};

function el(id) { return document.getElementById(id); }
function typeKey(t) { return TYPE_KEYS[t] || "person"; }
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

async function init() {
  const r = await fetch("/api/styles");
  state.data = await r.json();
  if (!state.data.styles.length) {
    el("cards").innerHTML = '<div class="empty">暂无数据，点击右上角「更新数据」抓取</div>';
    return;
  }
  state.activeId = state.data.styles[0].id;
  renderNav();
  renderStyle();
  await loadSubjects();
  initGen();
  loadHistory();
  loadLlmProfiles();
}

function toast(msg, ok = true) {
  const e = el("toast");
  e.textContent = msg;
  e.className = "toast " + (ok ? "ok" : "err");
  e.style.display = "block";
  clearTimeout(e._t);
  e._t = setTimeout(() => e.style.display = "none", 3000);
}



/* ---------- 视图切换 ---------- */
function setView(v) {
  state.view = v;
  ["browse", "subj", "gen"].forEach(m =>
    el("mode-" + m).classList.toggle("active", v === m));
  el("browse-view").style.display = v === "browse" ? "" : "none";
  el("subj-view").style.display = v === "subj" ? "" : "none";
  el("gen-view").style.display = v === "gen" ? "" : "none";
  el("nav").style.display = v === "browse" ? "" : "none";
  if (v === "subj") loadSubjects();
}
el("mode-browse").onclick = () => setView("browse");
el("mode-subj").onclick = () => setView("subj");
el("mode-gen").onclick = () => setView("gen");

/* ---------- 场景库 ---------- */
function renderNav() {
  const groups = {};
  state.data.styles.forEach(s => { (groups[s.group] ||= []).push(s); });
  const nav = el("nav");
  nav.innerHTML = "";
  for (const [g, styles] of Object.entries(groups)) {
    const t = document.createElement("div");
    t.className = "group-title";
    t.textContent = g;
    nav.appendChild(t);
    for (const s of styles) {
      const b = document.createElement("button");
      b.className = "nav-item" + (s.id === state.activeId ? " active" : "");
      b.innerHTML = `${esc(s.name)}<span class="count">${s.scenarios.length}</span>`;
      b.onclick = () => { state.activeId = s.id; renderNav(); renderStyle(); };
      nav.appendChild(b);
    }
  }
}

function renderStyle() {
  const s = state.data.styles.find(x => x.id === state.activeId);
  if (!s) return;
  el("style-title").textContent = s.name;
  el("style-count").textContent = `${s.scenarios.length} 场景 · ${s.group}`;
  el("style-why").textContent = "Why we chose this prompt: " + s.why_chosen;
  const q = state.q.trim().toLowerCase();
  const cards = el("cards");
  cards.innerHTML = "";
  s.scenarios
    .filter(sc => !q || (sc.prompt + " " + sc.label).toLowerCase().includes(q))
    .forEach(sc => cards.appendChild(cardEl(s, sc)));
  if (!cards.children.length) cards.innerHTML = '<div class="empty">无匹配场景</div>';
}

function cardEl(style, sc) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <h3>${esc(sc.label)}</h3>
      <span class="ar-badge ${sc.aspect_ratio ? "" : "ar-empty"}">
        ${sc.aspect_ratio ? "AR " + esc(sc.aspect_ratio) : "比例未定"}
      </span>
      ${sc.creative_copy ? '<span class="cc-badge">创意文案 ' + sc.creative_copy.length + "</span>" : ""}
    </div>
    <div class="prompt">${esc(sc.prompt)}</div>
    <div class="meta-row">
      <input type="text" placeholder="比例 2:3" value="${esc(sc.aspect_ratio || "")}" data-ar>
      <button class="btn small" data-save-ar>保存比例</button>
      <a href="${esc(sc.url)}" target="_blank">原页面 ↗</a>
    </div>
    <details class="cc" ${sc.creative_copy ? "open" : ""}>
      <summary>创意文案（LLM 生成 / 手动编辑）</summary>
      <div data-cc-list></div>
      <div class="cc-actions">
        <button class="btn small" data-add-cc>+ 加一条</button>
        <button class="btn small primary" data-save-cc>保存文案</button>
      </div>
    </details>`;

  card.querySelector("[data-save-ar]").onclick = async () => {
    const val = card.querySelector("[data-ar]").value.trim();
    if (val && !/^\d+:\d+$/.test(val)) return toast("比例格式应为 2:3 这类", false);
    await patch(style.id, sc.id, { aspect_ratio: val || null, aspect_ratio_source: "manual" });
  };

  const list = card.querySelector("[data-cc-list]");
  const ccItems = (sc.creative_copy || []).map(c => ({ ...c }));
  function renderCC() {
    list.innerHTML = "";
    ccItems.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "cc-item";
      row.innerHTML = `
        <input class="cc-label" placeholder="标签" value="${esc(item.label)}">
        <textarea placeholder="文案内容">${esc(item.value)}</textarea>`;
      row.querySelector("input").oninput = e => ccItems[i].label = e.target.value;
      row.querySelector("textarea").oninput = e => ccItems[i].value = e.target.value;
      list.appendChild(row);
    });
    if (!ccItems.length) list.innerHTML = '<div class="empty" style="padding:8px">暂无，点击下方「加一条」</div>';
  }
  renderCC();
  card.querySelector("[data-add-cc]").onclick = () => { ccItems.push({ label: "", value: "" }); renderCC(); };
  card.querySelector("[data-save-cc]").onclick = async () => {
    const clean = ccItems.filter(c => c.label.trim() && c.value.trim());
    if (!clean.length) return toast("至少需要一条完整文案", false);
    await patch(style.id, sc.id, { creative_copy: clean });
  };
  return card;
}

async function patch(styleId, scId, body) {
  const r = await fetch(`/api/scenarios/${styleId}/${scId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (r.ok) { toast("已保存并同步 styles.json"); await refresh(false); }
  else toast("保存失败: " + await r.text(), false);
}

async function refresh(reNav = true) {
  const r = await fetch("/api/styles");
  state.data = await r.json();
  if (!state.data.styles.find(x => x.id === state.activeId))
    state.activeId = state.data.styles[0]?.id || null;
  if (reNav) renderNav();
  renderStyle();
}

el("search").addEventListener("input", e => { state.q = e.target.value; renderStyle(); });

/* ---------- 主体库 ---------- */
async function loadSubjects() {
  state.subjects = await (await fetch("/api/subjects")).json();
  renderSubjects();
  populateGenSubjects();
}

function renderSubjects() {
  el("subj-count").textContent = `${state.subjects.length} 个主体`;
  const box = el("subj-list");
  box.innerHTML = "";
  if (!state.subjects.length) {
    box.innerHTML = '<div class="empty">还没有主体，从上方添加；在生成器里可随时选「自定义」手动输入</div>';
    return;
  }
  state.subjects.forEach(s => box.appendChild(subjectCard(s)));
}

function subjectCard(s) {
  if (state.editingSubjectId === s.id) {
    // 编辑态：复用顶部表单
    const hint = document.createElement("div");
    hint.className = "card";
    hint.innerHTML = `<div class="card-head"><span class="badge type-${typeKey(s.type)}">编辑中</span><h3>${esc(s.name)}</h3></div>
      <div class="subj-meta">修改上方表单内容后点「保存修改」</div>`;
    return hint;
  }
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `
    <div class="card-head">
      <span class="badge type-${typeKey(s.type)}">${esc(s.type)}</span>
      <h3>${esc(s.name)}</h3>
      <span class="spacer"></span>
      <button class="btn small" data-edit>编辑</button>
      <button class="btn small" data-del>删除</button>
    </div>
    <div class="prompt">${esc(s.description)}</div>`;
  d.querySelector("[data-edit]").onclick = () => {
    state.editingSubjectId = s.id;
    el("subj-name").value = s.name;
    el("subj-desc").value = s.description;
    el("subj-type").value = s.type;
    el("subj-save").textContent = "保存修改";
    el("subj-cancel").style.display = "";
    renderSubjects();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  d.querySelector("[data-del]").onclick = async () => {
    if (!confirm(`删除主体「${s.name}」？生成历史中的记录会保留名称快照。`)) return;
    const r = await fetch(`/api/subjects/${s.id}`, { method: "DELETE" });
    if (r.ok) { toast("已删除"); loadSubjects(); } else toast("删除失败", false);
  };
  return d;
}

async function saveSubject() {
  const body = {
    type: el("subj-type").value,
    name: el("subj-name").value.trim(),
    description: el("subj-desc").value.trim(),
  };
  if (!body.name) return toast("请填写主体名称", false);
  if (!body.description) return toast("请填写主体描述", false);
  const editing = state.editingSubjectId;
  const r = await fetch(editing ? `/api/subjects/${editing}` : "/api/subjects", {
    method: editing ? "PATCH" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) return toast(d.detail || "保存失败", false);
  toast(editing ? "已保存修改" : "已添加");
  resetSubjectForm();
  await loadSubjects();
}

function resetSubjectForm() {
  state.editingSubjectId = null;
  el("subj-name").value = "";
  el("subj-desc").value = "";
  el("subj-save").textContent = "添加主体";
  el("subj-cancel").style.display = "none";
}

el("subj-save").onclick = saveSubject;
el("subj-cancel").onclick = () => { resetSubjectForm(); renderSubjects(); };

/* ---------- 生成器 ---------- */
function currentGenStyle() { return state.data.styles.find(x => x.id === el("gen-style").value); }
function currentGenScenario() {
  const style = currentGenStyle();
  return style?.scenarios.find(x => x.id === el("gen-scenario").value);
}
function currentTemplate() {
  const sc = currentGenScenario();
  if (!sc) return null;
  const lbl = el("gen-template").value;
  return (sc.creative_copy || []).find(t => t.label === lbl) || null;
}

function initGen() {
  if (!state.data?.styles.length) return;
  const sel = el("gen-style");
  const prev = sel.value;
  sel.innerHTML = state.data.styles.map(s =>
    `<option value="${s.id}">${esc(s.group)} · ${esc(s.name)}</option>`).join("");
  if (prev) sel.value = prev;
  if (!sel.value) sel.value = state.data.styles[0].id;
  el("gen-ratio").innerHTML = '<option value="">自动</option>' + RATIOS.map(r => `<option>${r}</option>`).join("");
  onGenStyleChange();
  sel.onchange = onGenStyleChange;
  el("gen-scenario").onchange = onGenScenarioChange;
  el("gen-template").onchange = onGenTemplateChange;
  el("gen-subject-sel").onchange = onGenSubjectSelChange;
  el("gen-go").onclick = runGenerate;
  el("btn-refresh-hist").onclick = loadHistory;
}

function populateGenSubjects() {
  const sel = el("gen-subject-sel");
  sel.innerHTML = '<option value="">自定义（手动输入）</option>' +
    state.subjects.map(s => `<option value="${s.id}">[${esc(s.type)}] ${esc(s.name)}</option>`).join("");
  onGenSubjectSelChange();
}

function onGenSubjectSelChange() {
  const id = parseInt(el("gen-subject-sel").value) || null;
  state.genSubjectId = id;
  if (id) {
    const s = state.subjects.find(x => x.id === id);
    if (s) el("gen-subject").value = s.description;
  } else {
    el("gen-subject").value = "";
  }
}

function onGenStyleChange() {
  const style = currentGenStyle();
  if (!style) return;
  el("gen-scenario").innerHTML = style.scenarios.map(sc => `<option value="${sc.id}">${esc(sc.label)}</option>`).join("");
  onGenScenarioChange();
}

function onGenScenarioChange() {
  const sc = currentGenScenario();
  if (!sc) return;
  const tpls = sc.creative_copy || [];
  el("gen-template").innerHTML = tpls.map(t =>
    `<option value="${esc(t.label)}">${esc(t.label)}</option>`).join("");
  onGenTemplateChange();
}

function onGenTemplateChange() {
  const sc = currentGenScenario();
  const tpl = currentTemplate();
  if (!tpl) { el("gen-tpl-preview").textContent = "该场景暂无创意模板"; return; }
  el("gen-tpl-preview").textContent = tpl.value;
  if (sc?.aspect_ratio) el("gen-ratio").value = sc.aspect_ratio;
}

async function runGenerate() {
  const body = {
    style_id: el("gen-style").value,
    scenario_id: el("gen-scenario").value,
    template_label: el("gen-template").value,
    subject: el("gen-subject").value.trim(),
    aspect_ratio: el("gen-ratio").value || null,
    subject_id: state.genSubjectId,
  };
  if (!body.template_label) return toast("该场景暂无创意模板", false);
  if (!body.subject && !body.subject_id) return toast("请选择主体或填写主体描述", false);
  const btn = el("gen-go");
  btn.disabled = true;
  btn.textContent = "生成中…请耐心等待";
  el("gen-status").style.display = "inline";
  el("gen-status").textContent = "LLM 按规范生成中";
  try {
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.detail || "生成失败", false); return; }
    const box = el("gen-result");
    box.innerHTML = "";
    box.appendChild(resultCard(d));
    box.scrollIntoView({ behavior: "smooth", block: "start" });
    toast("生成完成");
    loadHistory();
  } catch (e) {
    toast("生成失败: " + e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = "生成提示词";
    el("gen-status").style.display = "none";
  }
}

function resultCard(g) {
  const d = document.createElement("div");
  d.className = "card gen-result";
  d.innerHTML = `
    <div class="card-head">
      <h3>${esc(g.style_id)} / ${esc(g.scenario_id)} · ${esc(g.template_label)}</h3>
      ${g.subject_name ? `<span class="badge type-${typeKey(g.subject_type)}">${esc(g.subject_name)}</span>` : ""}
      <span class="ar-badge">AR ${esc(g.aspect_ratio || "—")}</span>
      <span class="badge">${esc(g.model || "")}</span>
    </div>
    <div class="field"><label>你的主体</label><div class="prompt">${esc(g.subject)}</div></div>
    <div class="field">
      <label>中文提示词</label>
      <div class="prompt">${esc(g.prompt_zh)}</div>
    </div>
    <div class="field">
      <label>英文提示词</label>
      <div class="prompt en">${esc(g.prompt_en)}</div>
    </div>
    ${g.notes ? `<div class="meta-row"><span class="badge">思路</span><span style="color:var(--muted);font-size:12px">${esc(g.notes)}</span></div>` : ""}
    <div class="cc-actions">
      <button class="btn small" data-copy-zh>复制中文</button>
      <button class="btn small" data-copy-en>复制英文</button>
      <button class="btn small" data-copy-both>复制双语</button>
    </div>`;
  d.querySelector("[data-copy-zh]").onclick = () => copyText(g.prompt_zh);
  d.querySelector("[data-copy-en]").onclick = () => copyText(g.prompt_en);
  d.querySelector("[data-copy-both]").onclick = () =>
    copyText(`【中文】\n${g.prompt_zh}\n\n【English】\n${g.prompt_en}`);
  return d;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(
    () => toast("已复制"), () => toast("复制失败", false));
}

async function loadHistory() {
  const r = await fetch("/api/generations?limit=30");
  state.genHistory = await r.json();
  const box = el("gen-history");
  box.innerHTML = "";
  if (!state.genHistory.length) {
    box.innerHTML = '<div class="empty" style="padding:16px">还没有生成记录</div>';
    return;
  }
  state.genHistory.forEach(g => {
    const item = document.createElement("div");
    item.className = "hist-item";
    const dt = (g.created_at || "").replace("T", " ").replace("Z", "");
    const descShort = esc((g.subject || "").slice(0, 60)) + ((g.subject || "").length > 60 ? "…" : "");
    const nameBadge = g.subject_name
      ? `<span class="badge type-${typeKey(g.subject_type)}">${esc(g.subject_name)}</span> `
      : "";
    const lineText = g.subject_name ? descShort : descShort;
    item.innerHTML = `
      <div class="t">${esc(dt)} · ${esc(g.style_id)} / ${esc(g.scenario_id)} · ${esc(g.template_label)} · AR ${esc(g.aspect_ratio || "—")}</div>
      <div class="s">${nameBadge}${lineText}</div>`;
    item.onclick = () => {
      const box = el("gen-result");
      box.innerHTML = "";
      box.appendChild(resultCard(g));
      box.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    box.appendChild(item);
  });
}

/* ---------- LLM 设置 ---------- */
async function loadLlmProfiles() {
  state.llm.profiles = await (await fetch("/api/llm/profiles")).json();
  state.llm.current = await (await fetch("/api/llm/current")).json();
  renderLlmProfiles();
  const cur = state.llm.current;
  el("llm-current").innerHTML = `当前生效：${
    cur.source === "settings"
      ? `配置「${esc(cur.profile_name)}」`
      : ".env / 环境变量"} · ${esc(cur.model)} · key ${esc(cur.api_key_masked)}`;
  const gm = el("gen-current-model");
  if (gm) gm.textContent = `模型 ${cur.model || "—"}`;
}

function renderLlmProfiles() {
  const box = el("llm-profile-list");
  box.innerHTML = "";
  if (!state.llm.profiles.length) {
    box.innerHTML = '<div class="empty" style="padding:10px">暂无配置，使用 .env / 环境变量；在下方添加</div>';
    return;
  }
  state.llm.profiles.forEach(p => {
    const d = document.createElement("div");
    d.className = "llm-item" + (p.is_active ? " active" : "");
    d.innerHTML = `
      <div class="card-head">
        <h3>${esc(p.name)}</h3>
        ${p.is_active ? '<span class="badge" style="background:rgba(74,222,128,.12);color:var(--accent2)">使用中</span>' : ""}
        <span class="spacer"></span>
        ${p.is_active ? "" : '<button class="btn small" data-act>设为使用</button>'}
        <button class="btn small" data-edit>编辑</button>
        <button class="btn small" data-del>删除</button>
      </div>
      <div class="llm-meta">${esc(p.model)} · ${esc(p.base_url)} · key ${esc(p.api_key_masked)}</div>`;
    d.querySelector("[data-act]")?.addEventListener("click", async () => {
      const r = await fetch(`/api/llm/profiles/${p.id}/activate`, { method: "POST" });
      if (r.ok) { toast(`已切换为「${p.name}」`); loadLlmProfiles(); }
      else toast("切换失败", false);
    });
    d.querySelector("[data-edit]").addEventListener("click", () => {
      state.llm.editingId = p.id;
      el("llm-form-title").textContent = "编辑配置：" + p.name;
      el("llm-name").value = p.name;
      el("llm-model").value = p.model;
      el("llm-base-url").value = p.base_url;
      el("llm-api-key").value = "";
      el("llm-save").textContent = "保存修改";
      el("llm-cancel-edit").style.display = "";
    });
    d.querySelector("[data-del]").addEventListener("click", async () => {
      if (!confirm(`删除配置「${p.name}」？`)) return;
      const r = await fetch(`/api/llm/profiles/${p.id}`, { method: "DELETE" });
      if (r.ok) { toast("已删除"); loadLlmProfiles(); } else toast("删除失败", false);
    });
    box.appendChild(d);
  });
}

async function saveLlmProfile() {
  const body = {
    name: el("llm-name").value.trim(),
    base_url: el("llm-base-url").value.trim(),
    model: el("llm-model").value.trim(),
    api_key: el("llm-api-key").value.trim() || null,
  };
  const editing = state.llm.editingId;
  const r = await fetch(editing ? `/api/llm/profiles/${editing}` : "/api/llm/profiles", {
    method: editing ? "PATCH" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) return toast(d.detail || "保存失败", false);
  toast(editing ? "已保存" : "已添加并启用");
  resetLlmForm();
  loadLlmProfiles();
}

function resetLlmForm() {
  state.llm.editingId = null;
  el("llm-name").value = "";
  el("llm-model").value = "";
  el("llm-base-url").value = "";
  el("llm-api-key").value = "";
  el("llm-form-title").textContent = "添加配置";
  el("llm-save").textContent = "保存配置";
  el("llm-cancel-edit").style.display = "none";
}

el("btn-settings").onclick = () => {
  el("settings-modal").style.display = "flex";
  resetLlmForm();
  loadLlmProfiles();
};
el("settings-modal").querySelector("[data-close]").onclick = () =>
  el("settings-modal").style.display = "none";
el("settings-modal").addEventListener("click", e => {
  if (e.target === el("settings-modal")) el("settings-modal").style.display = "none";
});
el("llm-save").onclick = saveLlmProfile;
el("llm-cancel-edit").onclick = () => { resetLlmForm(); renderLlmProfiles(); };

/* ---------- 抓取 / 补全 ---------- */
el("btn-scrape").onclick = async function () {
  this.disabled = true; this.textContent = "抓取中…";
  try {
    const r = await fetch("/api/scrape", { method: "POST" });
    const d = await r.json();
    if (r.ok) { toast(`已更新：${d.styles} styles / ${d.scenarios} 场景`); await refresh(); }
    else toast("抓取失败: " + (d.detail || ""), false);
  } catch (e) { toast("抓取失败: " + e.message, false); }
  this.disabled = false; this.textContent = "更新数据";
};

el("btn-enrich").onclick = async function () {
  const st = await (await fetch("/api/enrich/status")).json();
  if (st.running) { toast(`补全进行中 ${st.done}/${st.total}`); return watchEnrich(this); }
  this.disabled = true; this.textContent = "补全中…";
  const r = await fetch("/api/enrich", { method: "POST" });
  const d = await r.json();
  if (!r.ok || d.ok === false) {
    toast(d.detail || "启动失败", false);
    this.disabled = false; this.textContent = "LLM 补全";
    return;
  }
  toast("LLM 补全已启动");
  watchEnrich(this);
};

async function watchEnrich(btn) {
  btn.disabled = true; btn.textContent = "补全中…";
  while (true) {
    await new Promise(res => setTimeout(res, 3000));
    let st;
    try { st = await (await fetch("/api/enrich/status")).json(); } catch { continue; }
    btn.textContent = st.total ? `补全中 ${st.done}/${st.total}` : "补全中…";
    if (!st.running) {
      if (st.error) toast("补全失败: " + st.error, false);
      else if (st.total) toast(`补全完成 ${st.total - st.failed}/${st.total}`);
      else toast("没有需要补全的数据");
      btn.disabled = false; btn.textContent = "LLM 补全";
      await refresh();
      return;
    }
  }
}

init();
setView("browse");
</script>
</body>
</html>
