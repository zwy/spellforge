<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咒语工坊 · SpellForge</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
<link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>
<div class="wrap">
  <header class="page-top">
    <span class="brand"><img class="brand-logo" src="/static/favicon.svg" alt="SpellForge">咒语工坊</span>
    <span class="badge" id="app-version" title="SpellForge 版本">v…</span>
    <nav>
      <a href="#browse" data-nav="browse" class="active">场景库</a>
      <a href="#subj" data-nav="subj">主体库</a>
      <a href="#gen" data-nav="gen">生成器</a>
      <span class="nav-div" aria-hidden="true"></span>
      <a href="/spec.md" target="_blank" rel="noopener">规范 ↗</a>
      <button type="button" id="nav-settings" title="LLM 设置">⚙ 设置</button>
    </nav>
  </header>

  <div class="statusbar" id="statusbar" hidden></div>

  <!-- 场景库 -->
  <section id="view-browse">
    <div class="toolbar">
      <select id="style-select" aria-label="选择风格" autocomplete="off"></select>
      <input id="search" type="search" placeholder="搜索提示词 / 场景…" aria-label="搜索提示词 / 场景">
      <span class="spacer"></span>
      <span class="badge" id="style-count"></span>
      <button class="btn" id="btn-scrape">更新数据</button>
      <button class="btn primary" id="btn-enrich">LLM 补全</button>
    </div>
    <p class="why" id="style-why"></p>
    <div class="grid" id="cards"></div>
  </section>

  <!-- 主体库 -->
  <section id="view-subj" hidden>
    <div class="topbar">
      <h2>主体库</h2>
      <span class="badge" id="subj-count"></span>
    </div>
    <div class="panel" id="subject-form">
      <div class="form-grid">
        <div class="field" style="max-width:200px">
          <label for="subj-type">类型</label>
          <select id="subj-type">
            <option>人物</option><option>产品</option><option>景物</option><option>品牌</option>
          </select>
        </div>
        <div class="field">
          <label for="subj-name">名称</label>
          <input id="subj-name" type="text" placeholder="例：街拍青年、枫叶咖啡壶">
        </div>
        <div class="field" style="grid-column:1/-1">
          <label for="subj-desc">描述</label>
          <textarea id="subj-desc" rows="3"
            placeholder="主体完整描述，生成提示词时会直接写入：外貌、材质、穿着、场景内状态等，写得越具象越好。"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn primary" id="subj-save">添加主体</button>
        <button class="btn ghost" id="subj-cancel" hidden>取消编辑</button>
      </div>
    </div>
    <div class="grid" id="subj-list"></div>
  </section>

  <!-- 生成器 -->
  <section id="view-gen" hidden>
    <div class="topbar">
      <h2>Prompt 生成器</h2>
      <span class="badge" id="gen-current-model">模型加载中…</span>
    </div>
    <div class="panel">
      <div class="form-grid">
        <div class="field"><label for="gen-style">风格</label><select id="gen-style"></select></div>
        <div class="field"><label for="gen-scenario">场景</label><select id="gen-scenario"></select></div>
        <div class="field" style="grid-column:1/-1">
          <label for="gen-template">创意模板</label><select id="gen-template"></select>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="gen-tpl-preview">模板内容</label>
        <div class="prompt prompt-sm" id="gen-tpl-preview">选择模板后显示</div>
      </div>
      <div class="form-grid" style="margin-top:12px">
        <div class="field"><label for="gen-ratio">画幅比例（留空由 LLM 按规范决定）</label><select id="gen-ratio"></select></div>
        <div class="field"><label for="gen-subject-sel">主体（选「自定义」则手动输入）</label>
          <select id="gen-subject-sel"></select></div>
        <div class="field" style="grid-column:1/-1">
          <label for="gen-subject">主体描述</label>
          <textarea id="gen-subject" rows="3"
            placeholder="例：一只戴红色围巾的柯基犬；从上方选择主体后会自动填入，可再修改"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn primary" id="gen-go">生成提示词</button>
      </div>
    </div>
    <div class="grid" id="gen-result" hidden></div>
    <div class="topbar" style="margin-top:24px">
      <h3>生成历史</h3><span class="spacer"></span>
      <button class="btn small" id="btn-refresh-hist">刷新</button>
    </div>
    <div class="tablecard" id="gen-history"></div>
  </section>
</div>

<!-- LLM 设置弹窗 -->
<div class="modal-mask" id="settings-modal" hidden role="dialog" aria-modal="true"
  aria-labelledby="llm-settings-title">
  <div class="modal">
    <div class="modal-head">
      <h3 id="llm-settings-title">LLM 设置</h3>
      <button class="btn small ghost" data-close type="button">关闭</button>
    </div>
    <p class="meta">可保存多套 OpenAI 规范（chat）配置，点「设为使用」切换当前生效配置；
      未启用任何配置时使用 .env / 环境变量。配置保存在本地 data/personal.db，不随项目公开。</p>
    <p class="meta" id="llm-current" style="margin-top:-4px"></p>
    <div class="modal-sub">我的配置</div>
    <div id="llm-profile-list"></div>
    <div class="modal-sub" id="llm-form-title">添加配置</div>
    <div class="form-grid">
      <div class="field"><label for="llm-name">名称</label>
        <input id="llm-name" type="text" placeholder="例：OpenRouter 主力"></div>
      <div class="field"><label for="llm-model">模型</label>
        <input id="llm-model" type="text" placeholder="deepseek/deepseek-v4.1-flash"></div>
      <div class="field" style="grid-column:1/-1">
        <label for="llm-base-url">BASE_URL（OpenAI 规范，不含 /chat/completions）</label>
        <input id="llm-base-url" type="text" placeholder="https://openrouter.ai/api/v1"></div>
      <div class="field" style="grid-column:1/-1">
        <label for="llm-api-key">API_KEY（编辑时留空 = 不修改）</label>
        <input id="llm-api-key" type="password" placeholder="sk-..."></div>
    </div>
    <div class="form-actions">
      <button class="btn primary" id="llm-save" type="button">保存配置</button>
      <button class="btn ghost" id="llm-cancel-edit" type="button" hidden>取消编辑</button>
    </div>
  </div>
</div>

<script src="/static/app.js?v=1"></script>
</body>
</html>
